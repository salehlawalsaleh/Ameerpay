<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmeerPay — Smart Payment</title>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif}
    body{background:linear-gradient(135deg,#00b4db,#0083b0);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:420px;background:rgba(255,255,255,0.12);backdrop-filter:blur(12px);border-radius:20px;padding:30px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
    h1{font-size:1.8rem;margin-bottom:6px}
    .tag{color:#d6eaff;margin-bottom:20px}
    label{display:block;margin-bottom:6px;color:#e2f1ff;font-size:0.9rem}
    input{width:100%;padding:12px;border-radius:10px;border:none;background:rgba(255,255,255,0.12);color:#fff;font-size:1rem;margin-bottom:14px}
    button{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6dd5fa,#2980b9);color:#fff;font-weight:600;cursor:pointer}
    .status{margin-top:18px;font-size:0.95rem}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:rgba(0,0,0,0.8);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:0.3s}
    .toast.show{opacity:1;bottom:36px}
  </style>
</head>
<body>
  <div class="card">
    <h1>AmeerPay</h1>
    <p class="tag">Smart & Secure Paystack Integration</p>

    <form id="paymentForm">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>

      <label for="amount">Amount (₦)</label>
      <input id="amount" type="number" placeholder="e.g. 200" required>

      <button id="payBtn" type="submit">💳 Pay Now</button>
    </form>

    <div id="status" class="status">Checking backend...</div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const backendUrl = `${location.origin}/.netlify/functions/paystack`;

    // health check
    document.addEventListener("DOMContentLoaded", async () => {
      const status = document.getElementById("status");
      try {
        console.log("[DEBUG] health fetch ->", backendUrl);
        const r = await fetch(backendUrl);
        console.log("[DEBUG] health status", r.status);
        const txt = await r.text();
        console.log("[DEBUG] health body", txt);
        let j; try{ j = JSON.parse(txt); } catch(e){ j = null; }
        if (r.ok && j && j.success) { status.textContent = "🟢 Backend Connected Successfully!"; status.style.color = "#00ffb7"; }
        else { status.textContent = "🔴 Backend Not Connected!"; status.style.color = "#ff7777"; console.warn("[DEBUG] health not ok", r.status, j || txt); }
      } catch (err) {
        document.getElementById("status").textContent = "🔴 Backend Not Connected!";
        console.error("[DEBUG] health fetch error:", err);
      }
    });

    // payment
    document.getElementById("paymentForm").addEventListener("submit", payNow);
    function payNow(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const amount = Number(document.getElementById("amount").value) * 100;
      const payBtn = document.getElementById("payBtn");
      payBtn.disabled = true; payBtn.textContent = "Processing...";

      const handler = PaystackPop.setup({
        key: "pk_test_6351d09de2b28b62e4e8e4869c0eb45a1e3dca11",
        email, amount, currency: "NGN",
        callback: function(response){
          console.log("[DEBUG] Paystack reference:", response.reference);
          handleVerification(response.reference, payBtn);
        },
        onClose: function(){ showToast("⚠️ Payment window closed"); payBtn.disabled=false; payBtn.textContent="💳 Pay Now"; }
      });
      handler.openIframe();
    }

    async function handleVerification(reference, payBtn){
      try {
        console.log("[DEBUG] verifying ref", reference);
        const res = await fetch(backendUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ reference })});
        const txt = await res.text();
        console.log("[DEBUG] verify status", res.status, "body", txt);
        let j; try{ j = JSON.parse(txt); } catch(e){ j = { raw: txt }; }
        if (!res.ok || !j.success) {
          showToast("❌ Verification failed: " + (j.message || (j.data && j.data.gateway_response) || txt));
          console.error("[DEBUG] verify failed", res.status, j);
        } else {
          showToast("✅ Payment Verified!");
          console.log("[DEBUG] verify success", j.data);
        }
      } catch (err) {
        showToast("⚠️ Network error verifying payment");
        console.error("[DEBUG] verify error", err);
      } finally {
        if (payBtn) { payBtn.disabled=false; payBtn.textContent="💳 Pay Now"; }
      }
    }

    function showToast(msg){
      const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),3500);
    }
  </script>
</body>
</html>
